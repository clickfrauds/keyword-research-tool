name: Keyword Research Pipeline

on:
  workflow_dispatch:
    inputs:
      business_name:
        description: "Business name"
        required: true
      niche_description:
        description: "What the business does (e.g. 'AC repair and installation company')"
        required: true
      target_location:
        description: "Target location (e.g. 'Dubai, UAE', or 'N/A' if not local)"
        required: true
      seed_keywords:
        description: "Comma-separated seed keywords for this client"
        required: true
      keywords_csv_url:
        description: "OPTIONAL: raw URL of a Keyword Planner CSV export. When set, Stage 1 uses THAT keyword set instead of pulling ideas from the seeds — your own curated export, no second API pull."
        required: false
        default: ''
      research_type:
        description: "Deliverable type: google_ads (campaigns+script) | seo (website-builder content plan) | both"
        required: false
        default: 'google_ads'
        type: choice
        options:
          - google_ads
          - seo
          - both
      request_id:
        description: "Unique id for this run — set automatically when triggered from the Netlify form. Leave blank for manual runs."
        required: false
      existing_campaign:
        description: "EXISTING ACCOUNT MODE: client ki already-running campaign ka naam (naye ad groups isi mein jayenge)"
        required: false
        default: ''
      existing_ad_groups:
        description: "EXISTING ACCOUNT MODE: client ke already-live ad groups (comma-separated) — 2-way negative siloing ke liye"
        required: false
        default: ''
      max_ad_groups:
        description: "Max NEW ad groups (chhote/niche keyword sets ke liye 1-2 rakhen)"
        required: false
        default: '10'
      single_campaign:
        description: "Sab ad groups AIK campaign mein (true) — ya campaign ka naam likh dein. 'false' = Claude 1-3 campaigns bana sakta hai"
        required: false
        default: 'true'
      location_id:
        description: "OPTIONAL: explicit Google geo target id — blank = auto-resolve from target_location (universal, any market)"
        required: false
        default: ''
      language:
        description: "Content language CODE for a non-English/Arabic market: es, fr, de, it, pt, tr, ru... Blank = auto (English/Arabic by seed script). Sets Planner language + writes ad groups/landing pages/RSAs in this language. MUST match the website builder's language."
        required: false
        default: ''
      language_id:
        description: "OPTIONAL: explicit numeric Google language id (overrides 'language' above) — blank = auto"
        required: false
        default: ''
      lang_url_prefix:
        description: "Does the website publish this language under /{lang}/ ? yes = /ar/slug/ (the website builder's DEFAULT). no = domain root, /slug/. MUST match the builder's lang_url_prefix or every ad + sitelink 404s. Ignored for English."
        required: false
        default: 'yes'
      premium_areas:
        description: "OPTIONAL: areas to force to PREMIUM bids, comma-separated (e.g. Palm Jumeirah, Dubai Marina). Overrides the AI's call — use this to protect good areas from being bid down by mistake."
        required: false
        default: ''
      low_areas:
        description: "OPTIONAL: areas to force to LOW bids, comma-separated (e.g. Al Satwa, Deira, Al Karama). Overrides the AI's call — your own fraud/labour-area knowledge wins."
        required: false
        default: ''
      bid_currency:
        description: "Currency label for suggested Max CPC bids (Planner data is in the API account's currency)"
        required: false
        default: 'PKR'
      bid_fx_rate:
        description: "FX multiplier account-currency → bid_currency (1 = account already in that currency)"
        required: false
        default: '1'
      website_url:
        description: "Client website (e.g. https://clickadsprotector.com) — used for RSA Final URLs (Stage 3.8)"
        required: false
        default: ''
      push_customer_id:
        description: "API PUSH: target Google Ads customer id (digits, MCC-linked). Blank = CSV-only run"
        required: false
        default: ''
      push_mode:
        description: "API PUSH mode: validate = dry-run check only (nothing created) | live = create the campaign (Paused)"
        required: false
        default: 'validate'
        type: choice
        options:
          - validate
          - live
      push_phase:
        description: "API PUSH phase: auto = push the ads too once every landing page answers | structure = campaign + keywords only, ads held for a later run | creative = attach the ads to a structure that already exists"
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - structure
          - creative
      enable_campaign:
        description: "Turn the campaign ON at the end of the creative phase. Off by default because enabling starts spending"
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      daily_budget:
        description: "Campaign daily budget in the account currency. Blank = sized from the campaign's own bids and search volume"
        required: false
        default: ''
      landing_urls:
        description: "EXISTING PAGES: the client's live landing page URLs, comma or newline separated. Given these, seeds are read off the pages and one ad group is built per page"
        required: false
        default: ''

# Needed so Stage 5 can push the finished report to the results-data branch
# using the automatic GITHUB_TOKEN (no extra secret required for this part).
permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve request id (fallback for manual runs)
        id: reqid
        run: |
          if [ -z "${{ github.event.inputs.request_id }}" ]; then
            echo "value=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.request_id }}" >> "$GITHUB_OUTPUT"
          fi

      # EXISTING PAGES PATH. Only the seeds change: they are read off the
      # client's live pages instead of typed in, and the page->ad-group map is
      # written for the later stages. Everything after this is the normal
      # pipeline, so the strategy is still built on real Planner volumes.
      - name: Stage 0-CRAWL - Read the client's existing landing pages
        id: crawl
        if: ${{ github.event.inputs.landing_urls != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          CLAUDE_EFFORT_CRAWL: "low"
          LANDING_URLS: ${{ github.event.inputs.landing_urls }}
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          LANGUAGE: ${{ github.event.inputs.language }}
        run: |
          python scripts/crawl_landing_pages.py
          # Hand the crawled seeds to Stage 1. Written as a step output rather
          # than an env var because the Stage 1 step sets SEED_KEYWORDS in its
          # own env block, which would win over anything exported here.
          SEEDS=$(python -c "import json;print(','.join(json.load(open('landing_pages_source.json',encoding='utf-8'))['seed_keywords']))")
          echo "seeds=$SEEDS" >> "$GITHUB_OUTPUT"
          echo "Seeds from the pages: $SEEDS"

      - name: Stage 1 - Pull real keyword data from Google Ads
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_USE_PROTO_PLUS: "true"
          SEED_KEYWORDS: ${{ steps.crawl.outputs.seeds || github.event.inputs.seed_keywords }}
          # Universal targeting: geo auto-resolves from the free-text location,
          # language auto-detects from the seeds. Explicit ids override both.
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          LOCATION_ID: ${{ github.event.inputs.location_id }}
          LANGUAGE_ID: ${{ github.event.inputs.language_id }}
          LANGUAGE: ${{ github.event.inputs.language }}
        if: ${{ github.event.inputs.keywords_csv_url == '' }}
        run: python scripts/keyword_research.py

      - name: Stage 1-CSV - Use a Keyword Planner export instead of pulling
        if: ${{ github.event.inputs.keywords_csv_url != '' }}
        env:
          KEYWORDS_CSV_URL: ${{ github.event.inputs.keywords_csv_url }}
        run: python scripts/import_keyword_csv.py

      # SEO deliverables only. The Ads run is deliberately untouched: its
      # keyword set must stay exactly what Planner will report on, and
      # zero-volume long tail has no place in a bid strategy.
      - name: Stage 1.6 - Query network expansion (Google Autocomplete, free)
        if: ${{ github.event.inputs.research_type == 'seo' || github.event.inputs.research_type == 'both' }}
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_USE_PROTO_PLUS: "true"
          SEED_KEYWORDS: ${{ steps.crawl.outputs.seeds || github.event.inputs.seed_keywords }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          LOCATION_ID: ${{ github.event.inputs.location_id }}
          LANGUAGE_ID: ${{ github.event.inputs.language_id }}
          LANGUAGE: ${{ github.event.inputs.language }}
          AC_DEPTH: "2"
        run: python scripts/expand_autocomplete.py

      # Legacy mechanical clustering; Stage 3 no longer reads it. Skipped on a
      # CSV run because it wants Stage 1's .txt, which the import does not
      # produce — and a missing file would fail the whole workflow.
      - name: Stage 2 - Filter and cluster keywords (niche-agnostic)
        if: ${{ github.event.inputs.keywords_csv_url == '' }}
        run: python scripts/filter_and_cluster.py keyword_data_output.txt

      - name: Stage 2.5 - Score keywords (Python data refinery — free, no API)
        env:
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          MAX_KEYWORDS_FOR_AI: "400"
        run: python scripts/score_keywords.py

      - name: Stage 3 - Claude campaigns + ad groups + landing pages (~$0.30/run)
        if: ${{ github.event.inputs.research_type != 'seo' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          CLAUDE_EFFORT: "medium"
          MAX_AD_GROUPS: ${{ github.event.inputs.max_ad_groups || '10' }}
          MAX_KEYWORDS_PER_GROUP: "40"
          SINGLE_CAMPAIGN: ${{ github.event.inputs.single_campaign || 'true' }}
          EXISTING_CAMPAIGN: ${{ github.event.inputs.existing_campaign }}
          EXISTING_AD_GROUPS: ${{ github.event.inputs.existing_ad_groups }}
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          BID_CURRENCY: ${{ github.event.inputs.bid_currency || 'PKR' }}
          BID_FX_RATE: ${{ github.event.inputs.bid_fx_rate || '1' }}
          LANGUAGE: ${{ github.event.inputs.language }}
        run: python scripts/analyze_with_claude.py

      - name: Stage 3.6 - Generate negative-guard Google Ads Script (~$0.02)
        if: ${{ github.event.inputs.research_type != 'seo' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
        run: python scripts/generate_ads_script.py

      - name: Stage 3.7 - Niche-matched audience plan (Sonnet, prompt-cached, ~$0.05)
        if: ${{ github.event.inputs.research_type != 'seo' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          CLAUDE_EFFORT_AUDIENCES: "low"
          SINGLE_CAMPAIGN: ${{ github.event.inputs.single_campaign || 'true' }}
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
        run: python scripts/suggest_audiences.py

      - name: Stage 3.8 - RSA ad copy per ad group (policy-validated, ~$0.05)
        if: ${{ github.event.inputs.research_type != 'seo' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          CLAUDE_EFFORT_RSA: "low"
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          LANGUAGE: ${{ github.event.inputs.language }}
          LANG_URL_PREFIX: ${{ github.event.inputs.lang_url_prefix }}
        run: python scripts/generate_rsa_ads.py

      - name: Stage 3.85 - Ad-group sitelinks from the landing-page anchors (~$0.02)
        if: ${{ github.event.inputs.research_type != 'seo' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: claude-sonnet-5
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          LANGUAGE: ${{ github.event.inputs.language }}
          LANG_URL_PREFIX: ${{ github.event.inputs.lang_url_prefix }}
        run: python scripts/generate_sitelinks.py

      - name: Stage 3.9 - Location targeting CSV + Claude bid tiers + negative locations (~$0.02)
        if: ${{ github.event.inputs.research_type != 'seo' }}
        env:
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          # Your own area calls, which override the model's. Use premium_areas to
          # protect areas that must never be bid down by a bad classification.
          PREMIUM_AREAS: ${{ github.event.inputs.premium_areas }}
          LOW_AREAS: ${{ github.event.inputs.low_areas }}
        run: python scripts/generate_locations.py

      - name: Stage 3.95 - Master CSV (ONE Editor import - campaign settings + keywords + negatives + RSAs + locations)
        if: ${{ github.event.inputs.research_type != 'seo' }}
        env:
          # Blank = the CSV takes the sized budget out of the strategy, so the
          # imported campaign and the pushed one agree on the number.
          DAILY_BUDGET: ${{ github.event.inputs.daily_budget }}
        run: python scripts/generate_master_csv.py

      - name: Stage 4-PUSH - Direct API push to Google Ads (validate or live)
        if: ${{ github.event.inputs.research_type != 'seo' && github.event.inputs.push_customer_id != '' }}
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID || secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_USE_PROTO_PLUS: "true"
          PUSH_CUSTOMER_ID: ${{ github.event.inputs.push_customer_id }}
          PUSH_MODE: ${{ github.event.inputs.push_mode || 'validate' }}
          DAILY_BUDGET: ${{ github.event.inputs.daily_budget }}
          PUSH_PHASE: ${{ github.event.inputs.push_phase || 'auto' }}
          ENABLE_CAMPAIGN: ${{ github.event.inputs.enable_campaign || 'no' }}
        run: python scripts/push_to_google_ads.py

      - name: Stage 3-SEO - Website-builder content plan (Mode 4 focus, ~$0.20)
        if: ${{ github.event.inputs.research_type == 'seo' || github.event.inputs.research_type == 'both' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          CLAUDE_EFFORT: "medium"
          MAX_SEO_CLUSTERS: "8"
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          LANGUAGE: ${{ github.event.inputs.language }}
        run: python scripts/generate_seo_strategy.py

      - name: Stage 4 - Generate client-ready HTML + CSV reports
        env:
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
        run: python scripts/generate_reports.py

      - name: Stage 5 - Push results for the Netlify form to pick up
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUEST_ID: ${{ steps.reqid.outputs.value }}
          RESULTS_BRANCH: results-data
        run: python scripts/push_results.py

      - name: Upload results as workflow artifact (backup / manual runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-strategy-${{ github.event.inputs.business_name }}-${{ github.run_number }}
          path: |
            keyword_data_output.txt
            keyword_data_output.json
            clustered_keywords.json
            scored_keywords.json
            keyword_strategy.json
            keyword_strategy.md
            google_ads_editor.csv
            google_ads_editor_negatives.csv
            google_ads_master.csv
            google_ads_push_report.md
            landing_pages.json
            negative_guard_script.js
            audiences_editor.csv
            audiences_editor_negatives.csv
            audience_plan.json
            audiences.md
            rsa_ads.json
            rsa_editor.csv
            rsa_ads.md
            locations_editor.csv
            locations_negative.csv
            locations.md
            website_builder_inputs.json
            seo_content_plan.md
            keyword_strategy_report.html
            keyword_strategy_targets.csv
