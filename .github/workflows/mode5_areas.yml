name: Mode 5 Area Plan (pSEO area-wise keyword research)

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request id (the frontend fills this)"
        default: ''
      business_name:
        default: ''
      niche_description:
        default: ''
      target_location:
        description: "CITY or STATE, COUNTRY — 'Dubai, UAE' for districts of a city; 'Arizona, United States' for separate towns. Every keyword is scoped to this geo, so asking for a town's demand from inside another city measures the wrong people."
        default: ''
      primary_service:
        description: "The one service these area pages sell — e.g. 'washing machine repair'"
        default: ''
      min_area_volume:
        description: "Keep an area only at/above this monthly volume. Planner's lowest bucket is 10, so 20 is the first number that means real demand."
        default: '20'
      max_areas:
        description: "LEAVE BLANK to research the whole area (recommended). Budget ~4s per area: a city of 103 takes ~7 min, a STATE of 360 takes ~30 min. A number here caps the run and leaves the rest unmeasured, not proven empty."
        default: ''
      ads_call_delay:
        description: "Seconds between Planner calls (default 3). Lower it to go faster; if you start seeing 'rate limit — waiting' lines, put it back."
        default: '3'
      extra_areas:
        description: "Extra area names to measure, comma-separated. Google cannot target Deira, Bur Dubai, Al Karama or JLT, but people search them — list any the plan is missing."
        default: ''
      language:
        default: ''

permissions:
  contents: write

jobs:
  area-plan:
    runs-on: ubuntu-latest
    # 360 areas at one Planner call each, plus the 3s spacing between them, is
    # 27-36 minutes for the research step alone -- before geocoding the
    # survivors and before the enrichment batches. 45 minutes killed the job
    # mid-run, and a killed job never reaches "Publish result JSON", so every
    # area already measured (and the API quota already spent on it) is lost.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve request id (fallback for manual runs)
        id: reqid
        run: |
          RID="${{ github.event.inputs.request_id }}"
          if [ -z "$RID" ]; then RID="manual-${{ github.run_id }}"; fi
          echo "value=$RID" >> $GITHUB_OUTPUT

      - name: Research every area of the city (Google Ads Planner)
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          # Only needed when the customer id above is a CLIENT account under a
          # manager. The script drops this when blank, so an unset secret cannot
          # send an empty header — the failure that killed the first run here.
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_USE_PROTO_PLUS: "true"
          # Needed only for countries whose geo data hangs areas off the province
          # instead of the city (Pakistan, much of the UK) — Claude decides which
          # of the province's areas are actually in the target city.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUSINESS_NAME: ${{ github.event.inputs.business_name }}
          NICHE_DESCRIPTION: ${{ github.event.inputs.niche_description }}
          TARGET_LOCATION: ${{ github.event.inputs.target_location }}
          PRIMARY_SERVICE: ${{ github.event.inputs.primary_service }}
          MIN_AREA_VOLUME: ${{ github.event.inputs.min_area_volume }}
          MAX_AREAS: ${{ github.event.inputs.max_areas }}
          EXTRA_AREAS: ${{ github.event.inputs.extra_areas }}
          LANGUAGE: ${{ github.event.inputs.language }}
          # Seconds between Planner calls. 3 is the safe default; on a small
          # city it is the difference between a 2-minute run and a 6-minute one.
          ADS_CALL_DELAY: ${{ github.event.inputs.ads_call_delay }}
        # -u, or Python block-buffers stdout into ~8KB chunks because CI is a
        # pipe, not a terminal. At ~90 chars a line that is ~90 areas, and at
        # 3s an area the log sits frozen for 4-5 minutes at a time while the
        # run is in fact progressing normally. Every other workflow here
        # already runs unbuffered.
        run: python -u scripts/generate_area_plan.py

      - name: Publish result JSON (raw link for the builder)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_ID: ${{ steps.reqid.outputs.value }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/push_results.py

      - name: Upload artifact (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: area-plan-${{ steps.reqid.outputs.value }}
          path: area_plan.json
          retention-days: 30
